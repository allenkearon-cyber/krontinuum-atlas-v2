name: Apply uploaded Atlas update

on:
  push:
    paths:
      - '.update/READY'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble uploaded Atlas
        shell: bash
        run: |
          cat .update/part*.b64 | base64 --decode > index.html
          test "$(wc -c < index.html)" -eq 191761
          test "$(sha256sum index.html | awk '{print $1}')" = "5bd95eeb349d3573b3acaf29f873928826dd5be3fcbad8571e9d7084c0934570"

      - name: Commit exact uploaded build
        shell: bash
        run: |
          rm -rf .update
          rm -f .github/workflows/apply_atlas_uploaded_update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Atlas v2 to latest uploaded build"
          git push
